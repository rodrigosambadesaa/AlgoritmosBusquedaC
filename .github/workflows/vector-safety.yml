name: Vector safety and original practice build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-vector-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the original sorting benchmark
        run: make clean && make
      - name: Sanitizers (BigDecimal, resize and overflow)
        run: |
          gcc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -fsanitize=address,undefined -fno-omit-frame-pointer -I. tests/test_vector_dinamico.c vector_dinamico.c big_decimal.c -o /tmp/test_vector_dinamico
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 /tmp/test_vector_dinamico

      - name: Exercise all four sorts on a deterministic reduced benchmark
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -DTAMANO_INICIAL=4UL -DTAMANO_FINAL=20UL -DPASO=4UL -DREPETICIONES=2UL -DVECTOR_CI_SMOKE main.c quick_sort.c vector_dinamico.c big_decimal.c -o "$RUNNER_TEMP/sorting_smoke"
          cd "$RUNNER_TEMP"
          ./sorting_smoke
          test "$(wc -l < tiempos_ordenacion.tsv)" -eq 6
          test "$(wc -l < tiemposFibonacciRecursivo.txt)" -eq 6
          awk -F '\t' 'NR == 1 {if (NF != 5) exit 1; next} {if (NF != 5 || $1 != (NR-1)*4) exit 1} END {if (NR != 6) exit 1}' tiempos_ordenacion.tsv
